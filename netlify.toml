# netlify.toml — Golapi Shop SPA Rewrites + Security Headers
# Place this file in the ROOT of your golapishop.online repository

[build]
  command = "npm run build"
  publish = "dist"

# Canonical host: live site resolves to the apex domain, so www
# is redirected to apex (avoids www/non-www duplicate content).
[[redirects]]
  from = "https://www.golapishop.online/*"
  to = "https://golapishop.online/:splat"
  status = 301
  force = true

# ─── SPA Rewrites ─────────────────────────────────────────────
# All unknown paths serve index.html so the JS router can handle them

[[redirects]]
  from = "/driver"
  to = "/driver/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/manager"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/driver/*"
  to = "/driver/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/manager/*"
  to = "/index.html"
  status = 200
  force = false

# SPA fallback — any path that doesn't match a real file
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ─── Security Headers ──────────────────────────────────────────
# ⚠️ CSP নোট: এই সাইট প্রচুর inline onclick="..." attribute ও inline <script>
# ব্যবহার করে (GTM snippet, JSON-LD, theme-detection)। তাই script-src/style-src-এ
# 'unsafe-inline' রাখা বাধ্যতামূলক — নইলে পুরো সাইটের বাটন/ইন্টারঅ্যাকশন ভেঙে যাবে।
# এটা CSP-এর XSS-বিরোধী সর্বোচ্চ সুরক্ষা কিছুট কমায়, কিন্তু তারপরও কোন ডোমেইন থেকে
# script/style/connection আসতে পারবে তা কডকড়িভাবে সীমাবদ্ধ রাখে (data exfiltration,
# অননুমোদিত iframe embedding, অচেন third-party script injection আটকায়)।
# ভবিষ্যতে সব onclick-কে addEventListener-এ রূপান্তর করলে 'unsafe-inline' সরিয়ে
# আরও কড়া nonce-based CSP করা সম্ভব হবে।

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://maps.googleapis.com https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://golapi-chat-proxy.studiomt46.workers.dev https://golapi-sms-proxy.studiomt46.workers.dev https://www.google-analytics.com https://analytics.google.com wss://*.firebaseio.com; frame-src 'self' https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Asset Links — required for TWA deep linking
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"

# ─── Fresh Deploy / Browser Cache Control ─────────────────────
# HTML and service workers stay no-cache so a new deployment is picked up
# immediately. JS/CSS/fragments get a SHORT 60s cache instead of no-cache:
# previously every visit paid a revalidation round-trip for ~20 JS files
# (~520KB of scripts) + CSS + fragments, which stacked up badly on slow
# mobile networks. 60s is short enough that a deploy is visible within a
# minute, and stale-while-revalidate refreshes the cache in the background
# after that — so repeat visits/reloads inside a session are instant,
# without the old 5-minute stale-after-deploy problem.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/driver/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app-version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/driver/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Static images/icons ───────────────────────────────────────
# একই filename-এর ছবি replace হলেও stale asset দীর্ঘদিন আটকে থাকবে না।
[[headers]]
  for = "/icons/*"
  [headers.values]
    # MT Studio audit fix: লোগো/ব্যানার/প্রোডাক্ট আইকন খুব কম বদলায় — আগে
    # JS/CSS-এর মতোই মাত্র ৫ মিনিট cache হতো, প্রতি visit-এ বারবার revalidate
    # করতে হতো। এখন ৭ দিন cache + ৩০ দিন stale-while-revalidate — repeat
    # visitor-দের জন্য ছবি লোড প্রায় সাথে সাথেই হবে। ছবি বদলালে ফাইলের নাম
    # বদলে দিলেই (যেমন logo-v2.webp) পুরনো cache আর দেখাবে না।
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
